<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Seating - Sign In</title>
  <style>
    body { 
          font-family: system-ui, Arial, sans-serif;
          font-size: 14px;
          line-height: 1.5;
          background: #ffffff;
          color: #111111;
          display: flex;
          justify-content: center;
          align-items: center;
          min-height: 100vh;
          margin: 0;
    }
    .box { width: 340px;  border: 1px solid #d0d0d0; padding: 28px; border-radius: 6px;}
    h2 {
        font-size: 18px;
        text-align: center;
        margin: 0 0 20px;
    }
    h3 {
        font-size: 14px;
        margin: 20px 0 10px;
    }
    form {
          display: flex;
          flex-direction: column;
          gap: 10px;
        }
    input { 
          width: 100%;
          padding: 8px 9px;
          border: 1px solid #d0d0d0;
          border-radius: 4px;
          font-family: inherit;
          font-size: 13px;
          outline: none;
    }
    input:focus {
          border-color: #1a56db;
    }
    button {
          width: 100%;
          padding: 8px;
          background: #1a56db;
          color: #ffffff;
          border: none;
          border-radius: 4px;
          font-family: inherit;
          font-size: 13px;
          font-weight: 600;
          cursor: pointer;
    }
    button:hover {
          background: #1446b8;
    } 
    .flash { padding: 8px; margin-bottom: 10px; }
    .flash.error { background: #fdd; }
    .flash.success { background: #dfd; }
  </style>
</head>
<body>
<div class="box">
  <h2>Smart Seating</h2>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}

  <h3>Sign In</h3>
  <form method="POST" action="/auth">
    <input type="hidden" name="action" value="login" />
    <input type="text" name="identifier" placeholder="Username or email" required />
    <input type="password" name="password" placeholder="Password" required />
    <button type="submit">Sign In</button>
  </form>

  <h3>Register</h3>
  <form method="POST" action="/auth">
    <input type="hidden" name="action" value="register" />
    <input type="text" name="username" placeholder="Username" minlength="3" required />
    <input type="email" name="email" placeholder="Email" required />
    <input type="password" name="password" placeholder="Password" minlength="8" required />
    <input type="password" name="confirm" placeholder="Confirm password" required />
    <button type="submit">Create Account</button>
  </form>
</div>
</body>
</html>
