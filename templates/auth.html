<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Seating - Sign In</title>
  <style>
    body { font-family: Arial, sans-serif; display: flex; justify-content: center; margin-top: 60px; }
    .box { width: 300px; }
    input { width: 100%; padding: 6px; margin-bottom: 8px; }
    .flash { padding: 8px; margin-bottom: 10px; }
    .flash.error { background: #fdd; }
    .flash.success { background: #dfd; }
  </style>
</head>
<body>
<div class="box">
  <h2>Smart Seating</h2>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}

  <h3>Sign In</h3>
  <form method="POST" action="/auth">
    <input type="hidden" name="action" value="login" />
    <input type="text" name="identifier" placeholder="Username or email" required />
    <input type="password" name="password" placeholder="Password" required />
    <button type="submit">Sign In</button>
  </form>

  <h3>Register</h3>
  <form method="POST" action="/auth">
    <input type="hidden" name="action" value="register" />
    <input type="text" name="username" placeholder="Username" minlength="3" required />
    <input type="email" name="email" placeholder="Email" required />
    <input type="password" name="password" placeholder="Password" minlength="8" required />
    <input type="password" name="confirm" placeholder="Confirm password" required />
    <button type="submit">Create Account</button>
  </form>
</div>
</body>
</html>
