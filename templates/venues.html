{% extends "base.html" %}
{% block title %}Venues{% endblock %}
{% block content %}
  <h1>Venues</h1>
  <a href="/venues/new" class="btn">+ New Venue</a>

  {% if venues %}
    <table>
      <tr><th>Name</th><th>Type</th><th>Size</th><th>Actions</th></tr>
      {% for v in venues %}
      <tr>
        <td>{{ v.name }}</td>
        <td>{{ v.venue_type }}</td>
        <td>{{ v.rows }}x{{ v.cols }}</td>
        <td>
          <a href="/venues/{{ v.id }}/edit">Edit</a>
          <form method="POST" action="/api/venues/{{ v.id }}" style="display:inline"
                onsubmit="return confirm('Delete this venue?')">
            <input type="hidden" name="_method" value="DELETE">
            <button type="submit">Delete</button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </table>
  {% else %}
    <p>No venues yet.</p>
  {% endif %}
{% endblock %}
