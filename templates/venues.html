{% extends "base.html" %}
{% block title %}Venues{% endblock %}
{% block content %}
  <h1>Venues</h1>
  <a href="/venues/new" class="btn">+ New Venue</a>

  {% if venues %}
    <table>
      <tr><th>Name</th><th>Type</th><th>Size</th><th>Actions</th></tr>
      {% for v in venues %}
      <tr>
        <td>{{ v.name }}</td>
        <td>{{ v.venue_type }}</td>
        <td>{{ v.rows }}x{{ v.cols }}</td>
        <td>
          <a href="/venues/{{ v.id }}/edit">Edit</a>
          <form method="POST" action="/api/venues/{{ v.id }}"
              onsubmit="return deleteVenue(event, {{ v.id }})">
             <button type="submit">Delete</button>
          </form>
          </form>
        </td>
      </tr>
      {% endfor %}
    </table>
  {% else %}
    <p>No venues yet.</p>
  {% endif %}

<script>
    // workaround for delete
  function deleteVenue(event, id) {
   event.preventDefault();
   if (!confirm('Delete this venue?')) return false;
    fetch(`/api/venues/${id}`, { method: 'DELETE' })
      .then(res => {
       if (res.ok) location.reload();
        else alert('Delete failed.');
      });
  return false;
}

</script>
{% endblock %}
