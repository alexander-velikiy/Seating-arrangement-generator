<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Seating Layout Design and Planner — Change Password</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --border:#d0d0d0; --accent:#1a56db; --danger:#cc0000;
      --surface:#f5f5f5; --muted:#555; --radius:4px; }
    body { font-family: system-ui, Arial, sans-serif; font-size: 14px;
      background: #fff; color: #111; display: flex;
      align-items: center; justify-content: center; min-height: 100vh; }
    .wrap { width: 340px; padding: 32px 28px; border: 1px solid var(--border);
      border-radius: var(--radius); }
    h1 { font-size: 15px; font-weight: 700; text-align: center; margin-bottom: 4px; }
    .subtitle { font-size: 12px; color: var(--muted); text-align: center; margin-bottom: 20px; }
    .form { display: flex; flex-direction: column; gap: 12px; }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field label { font-size: 12px; font-weight: 600; color: var(--muted); }
    input { border: 1px solid var(--border); border-radius: var(--radius);
      padding: 7px 9px; font-size: 13px; font-family: inherit;
      outline: none; width: 100%; }
    input:focus { border-color: var(--accent); }
    .btn { width: 100%; padding: 8px; background: var(--accent); color: #fff;
      border: none; border-radius: var(--radius); font-size: 13px; font-weight: 600;
      cursor: pointer; font-family: inherit; }
    .btn:hover { background: #1446b8; }
    .flash { padding: 8px 10px; border-radius: var(--radius); font-size: 12px;
      margin-bottom: 14px; border: 1px solid; }
    .flash.error   { background: #fff0f0; border-color: #f5b8b8; color: var(--danger); }
    .flash.success { background: #e8fff0; border-color: #a3e0b8; color: #1a7a3c; }
    .flash.info    { background: #e8f0ff; border-color: #b3d0ff; color: var(--accent); }
    .pw-hint { font-size: 11px; color: var(--muted); }
  </style>
</head>
<body>
<div class="wrap">
  <h1>Set a New Password</h1>
  <p class="subtitle">Your account requires a password change.</p>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}

  <form method="POST" action="/change-password" class="form">
    <div class="field">
      <label>New Password</label>
      <input type="password" name="password" placeholder="min. 8 characters"
             autocomplete="new-password" minlength="8" required />
      <p class="pw-hint">8+ characters, upper &amp; lower case, a number, and a symbol.</p>
    </div>
    <div class="field">
      <label>Confirm Password</label>
      <input type="password" name="confirm" placeholder="repeat password"
             autocomplete="new-password" required />
    </div>
    <button type="submit" class="btn">Update Password</button>
  </form>
</div>
</body>
</html>
